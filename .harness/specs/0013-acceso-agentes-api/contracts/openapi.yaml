components:
  schemas:
    AgentKeyCreate:
      additionalProperties: false
      description: Cuerpo de `POST /auth/agent-keys`; cualquier otro campo → 422.
      properties:
        label:
          maxLength: 64
          minLength: 1
          title: Label
          type: string
      required:
      - label
      title: AgentKeyCreate
      type: object
    AgentKeyCreated:
      description: 'Respuesta de la creación: el valor plano (`key`) viaja **sólo
        aquí** (RF-001).'
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        key:
          title: Key
          type: string
        label:
          title: Label
          type: string
      required:
      - id
      - label
      - key
      - created_at
      title: AgentKeyCreated
      type: object
    AgentKeyOut:
      description: 'Elemento del listado: sin `key` ni `key_hash` (RF-004/RNF-002).'
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        label:
          title: Label
          type: string
        last_used_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
      required:
      - id
      - label
      - created_at
      - last_used_at
      - revoked_at
      title: AgentKeyOut
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /auth/agent-keys:
    get:
      operationId: list_agent_keys_auth_agent_keys_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentKeyOut'
                title: Response List Agent Keys Auth Agent Keys Get
                type: array
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: List Agent Keys
      tags:
      - auth
    post:
      operationId: create_agent_key_auth_agent_keys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentKeyCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentKeyCreated'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent key label already in use
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Create Agent Key
      tags:
      - auth
  /auth/agent-keys/{key_id}:
    delete:
      operationId: revoke_agent_key_auth_agent_keys__key_id__delete
      parameters:
      - description: Id de la key a revocar.
        in: path
        name: key_id
        required: true
        schema:
          description: Id de la key a revocar.
          title: Key Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent key not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Revoke Agent Key
      tags:
      - auth
