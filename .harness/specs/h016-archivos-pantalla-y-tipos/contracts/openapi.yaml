components:
  schemas:
    Body_upload_file_files_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder
        vault_id:
          title: Vault Id
          type: string
        visibility:
          default: private
          enum:
          - private
          - public
          title: Visibility
          type: string
      required:
      - vault_id
      - file
      title: Body_upload_file_files_post
      type: object
    FileFolderCreate:
      additionalProperties: false
      description: 'Cuerpo de `POST /vaults/{vault_id}/file-folders` (H-046): ruta
        de la carpeta, con `/` entre niveles.'
      properties:
        path:
          examples:
          - Portafolio/Synapse
          title: Path
          type: string
      required:
      - path
      title: FileFolderCreate
      type: object
    FileFolderMove:
      additionalProperties: false
      description: 'Cuerpo de `POST /vaults/{vault_id}/file-folders/move` (H-046):
        mueve la carpeta y todo lo que contiene.'
      properties:
        from:
          examples:
          - Portafolio/Synapse
          title: From
          type: string
        to:
          examples:
          - Archivo/Synapse
          title: To
          type: string
      required:
      - from
      - to
      title: FileFolderMove
      type: object
    FileFolderMoveOut:
      properties:
        from:
          title: From
          type: string
        moved_files:
          title: Moved Files
          type: integer
        to:
          title: To
          type: string
      required:
      - from
      - to
      - moved_files
      title: FileFolderMoveOut
      type: object
    FileFoldersOut:
      description: 'Carpetas de archivos de una bóveda: ordenadas e incluyen las ancestras
        de cada una.'
      properties:
        folders:
          items:
            type: string
          title: Folders
          type: array
      required:
      - folders
      title: FileFoldersOut
      type: object
    FileMetaOut:
      description: Metadatos de un archivo (respuesta de `POST` y `PATCH /files/{id}`);
        nunca los bytes.
      properties:
        content_type:
          title: Content Type
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        size:
          title: Size
          type: integer
        vault_id:
          title: Vault Id
          type: string
        visibility:
          title: Visibility
          type: string
      required:
      - id
      - vault_id
      - name
      - content_type
      - size
      - visibility
      - folder
      - created_at
      title: FileMetaOut
      type: object
    FileUpdate:
      description: 'PATCH /files/{id}: actualizar name y/o visibility (C-5).'
      properties:
        folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        visibility:
          anyOf:
          - type: string
          - type: 'null'
          title: Visibility
      title: FileUpdate
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    VaultFilesResponse:
      description: 'GET /vaults/{vault_id}/files: lista paginada de archivos de la
        bóveda.'
      properties:
        files:
          items:
            $ref: '#/components/schemas/FileMetaOut'
          title: Files
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total:
          title: Total
          type: integer
      required:
      - files
      - total
      - limit
      - offset
      title: VaultFilesResponse
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /files:
    post:
      operationId: upload_file_files_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_files_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetaOut'
          description: Successful Response
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsafe SVG
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: File too large
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported file type
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Upload File
      tags:
      - files
  /files/{file_id}:
    delete:
      description: Borra el archivo (objeto + registro) solo si es del dueño (C-6).
      operationId: delete_file_files__file_id__delete
      parameters:
      - in: path
        name: file_id
        required: true
        schema:
          title: File Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: File not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Delete File
      tags:
      - files
    get:
      description: 'Sirve un archivo (C-3). Regla de acceso: privado exige sesión/key
        del dueño, público sin credencial.

        Cabeceras por tipo: imágenes/PDF/HTML inline, resto attachment. HTML con CSP
        sandbox.'
      operationId: get_file_files__file_id__get
      parameters:
      - in: path
        name: file_id
        required: true
        schema:
          title: File Id
          type: string
      responses:
        '200':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: File not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Get File
      tags:
      - files
    patch:
      description: 'Actualizar name, visibility y/o folder del archivo (C-5, H-046).
        Solo el dueño. La visibilidad se elige al subir (un agente

        puede pedir `public` entonces); después solo la cambia la persona con su sesión:
        una API key recibe 403.'
      operationId: update_file_files__file_id__patch
      parameters:
      - in: path
        name: file_id
        required: true
        schema:
          title: File Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetaOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied / File visibility is user-only
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: File not found
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported file type
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Update File
      tags:
      - files
  /vaults/{vault_id}/file-folders:
    delete:
      description: Borra una carpeta vacía y sus subcarpetas vacías. Con archivos
        dentro responde 409.
      operationId: delete_file_folder_vaults__vault_id__file_folders_delete
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: query
        name: path
        required: true
        schema:
          maxLength: 300
          minLength: 1
          title: Path
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Folder not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: File folder is not empty
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Delete File Folder
      tags:
      - files
    get:
      description: Todas las carpetas de archivos de la bóveda, ordenadas, con sus
        ancestras.
      operationId: list_file_folders_vaults__vault_id__file_folders_get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileFoldersOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: List File Folders
      tags:
      - files
    post:
      description: Crea una carpeta (y sus ancestras) aunque no tenga archivos. Idempotente;
        devuelve la lista completa.
      operationId: create_file_folder_vaults__vault_id__file_folders_post
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileFolderCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileFoldersOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Create File Folder
      tags:
      - files
  /vaults/{vault_id}/file-folders/move:
    post:
      description: Mueve (o renombra) una carpeta con todo lo que contiene. Si el
        destino ya existe, se fusionan.
      operationId: move_file_folder_vaults__vault_id__file_folders_move_post
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileFolderMove'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileFolderMoveOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Folder not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Move File Folder
      tags:
      - files
  /vaults/{vault_id}/files:
    get:
      description: 'Lista archivos de la bóveda del usuario (C-4). 404 si la bóveda
        no es suya.

        Paginación: limit (1-100, def 50) + offset. `folder` filtra por carpeta (H-046).'
      operationId: list_vault_files_vaults__vault_id__files_get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - description: Solo los archivos de esa carpeta (no de sus subcarpetas); vacío
          = los de la raíz; sin el parámetro, todos.
        in: query
        name: folder
        required: false
        schema:
          anyOf:
          - maxLength: 300
            type: string
          - type: 'null'
          description: Solo los archivos de esa carpeta (no de sus subcarpetas); vacío
            = los de la raíz; sin el parámetro, todos.
          title: Folder
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultFilesResponse'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: List Vault Files
      tags:
      - vaults
