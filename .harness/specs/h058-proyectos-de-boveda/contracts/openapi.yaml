components:
  schemas:
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    ProjectCreate:
      additionalProperties: false
      description: Cuerpo de `POST /vaults/{id}/projects`.
      properties:
        assignee_agent_id:
          anyOf:
          - pattern: ^[a-z0-9][a-z0-9-]{0,31}$
            type: string
          - type: 'null'
          title: Assignee Agent Id
        assignee_type:
          default: user
          enum:
          - user
          - agent
          title: Assignee Type
          type: string
        color:
          default: blue
          enum:
          - gray
          - blue
          - green
          - red
          - orange
          - yellow
          - purple
          - pink
          title: Color
          type: string
        description:
          anyOf:
          - maxLength: 20000
            type: string
          - type: 'null'
          title: Description
        sort_order:
          anyOf:
          - maximum: 100000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Sort Order
        status:
          default: active
          enum:
          - active
          - on_hold
          - completed
          title: Status
          type: string
        title:
          maxLength: 255
          minLength: 1
          title: Title
          type: string
      required:
      - title
      title: ProjectCreate
      type: object
    ProjectListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProjectOut'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: ProjectListOut
      type: object
    ProjectOut:
      description: Un proyecto de bóveda con su avance (de sus tareas raíz). Fechas
        en UTC con `Z`.
      properties:
        assignee_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee Agent Id
        assignee_type:
          title: Assignee Type
          type: string
        color:
          title: Color
          type: string
        created_at:
          title: Created At
          type: string
        created_by:
          title: Created By
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          title: Id
          type: string
        sort_order:
          title: Sort Order
          type: integer
        status:
          title: Status
          type: string
        tasks_done:
          default: 0
          title: Tasks Done
          type: integer
        tasks_total:
          default: 0
          title: Tasks Total
          type: integer
        title:
          title: Title
          type: string
        updated_at:
          title: Updated At
          type: string
        updated_by:
          title: Updated By
          type: string
        vault_id:
          title: Vault Id
          type: string
        version:
          title: Version
          type: integer
      required:
      - id
      - vault_id
      - sort_order
      - title
      - description
      - status
      - color
      - assignee_type
      - assignee_agent_id
      - created_by
      - updated_by
      - version
      - created_at
      - updated_at
      title: ProjectOut
      type: object
    ProjectUpdate:
      additionalProperties: false
      description: 'Cuerpo de `PATCH /vaults/{id}/projects/{project_id}`: solo cambia
        lo enviado.'
      properties:
        assignee_agent_id:
          anyOf:
          - pattern: ^[a-z0-9][a-z0-9-]{0,31}$
            type: string
          - type: 'null'
          title: Assignee Agent Id
        assignee_type:
          anyOf:
          - enum:
            - user
            - agent
            type: string
          - type: 'null'
          title: Assignee Type
        color:
          anyOf:
          - enum:
            - gray
            - blue
            - green
            - red
            - orange
            - yellow
            - purple
            - pink
            type: string
          - type: 'null'
          title: Color
        description:
          anyOf:
          - maxLength: 20000
            type: string
          - type: 'null'
          title: Description
        sort_order:
          anyOf:
          - maximum: 100000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Sort Order
        status:
          anyOf:
          - enum:
            - active
            - on_hold
            - completed
            type: string
          - type: 'null'
          title: Status
        title:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      title: ProjectUpdate
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /projects:
    get:
      description: Proyectos del dueño en todas sus bóvedas.
      operationId: list_my_projects_projects_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: List My Projects
      tags:
      - projects
  /vaults/{vault_id}/projects:
    get:
      description: Proyectos de la bóveda con su avance. Filtro `status` (repetible).
      operationId: list_vault_projects_vaults__vault_id__projects_get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: List Vault Projects
      tags:
      - projects
    post:
      operationId: create_project_vaults__vault_id__projects_post
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión del proyecto; se envía en `If-Match`.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Create Project
      tags:
      - projects
  /vaults/{vault_id}/projects/{project_id}:
    delete:
      description: 'Borra el proyecto; sus tareas no se borran: quedan sin proyecto.'
      operationId: delete_project_vaults__vault_id__projects__project_id__delete
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Project not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Delete Project
      tags:
      - projects
    get:
      operationId: get_project_vaults__vault_id__projects__project_id__get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión del proyecto; se envía en `If-Match`.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Project not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Get Project
      tags:
      - projects
    patch:
      description: 'Cambia solo lo enviado. `If-Match` (la `version` vigente) es opcional:
        con él, un cambio ajeno da 412.'
      operationId: update_project_vaults__vault_id__projects__project_id__patch
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: header
        name: if-match
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión del proyecto; se envía en `If-Match`.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Project not found
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Project precondition failed
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Update Project
      tags:
      - projects
