components:
  schemas:
    BulkDocsRejection:
      additionalProperties: false
      description: Revisión rechazada; PouchDB trata `forbidden` como *denied* y sigue
        con el lote.
      properties:
        error:
          const: forbidden
          title: Error
          type: string
        id:
          $ref: '#/components/schemas/JsonValue'
          description: '`_id` tal como lo envió el cliente.'
        reason:
          pattern: ^(invalid-id|owner-mismatch|immutable-field:created_at|vault-name-taken|delete-not-allowed|validation-error:.+|not-normalized:.+)$
          title: Reason
          type: string
        rev:
          $ref: '#/components/schemas/JsonValue'
          description: '`_rev` tal como lo envió el cliente.'
      required:
      - id
      - rev
      - error
      - reason
      title: BulkDocsRejection
      type: object
    BulkDocsRequest:
      additionalProperties: false
      description: 'Lote del replicador. `new_edits` debe ser `false`: el canal sólo
        replica revisiones.'
      properties:
        docs:
          items:
            additionalProperties: true
            type: object
          title: Docs
          type: array
        new_edits:
          const: false
          title: New Edits
          type: boolean
      required:
      - docs
      - new_edits
      title: BulkDocsRequest
      type: object
    JsonValue: {}
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
