components:
  schemas:
    Body_upload_file_files_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        vault_id:
          title: Vault Id
          type: string
      required:
      - vault_id
      - file
      title: Body_upload_file_files_post
      type: object
    FileMetaOut:
      description: Metadatos de un archivo (respuesta de `POST` y `PATCH /files/{id}`);
        nunca los bytes.
      properties:
        content_type:
          title: Content Type
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        size:
          title: Size
          type: integer
        vault_id:
          title: Vault Id
          type: string
        visibility:
          title: Visibility
          type: string
      required:
      - id
      - vault_id
      - name
      - content_type
      - size
      - visibility
      - created_at
      title: FileMetaOut
      type: object
    FileVisibilityUpdate:
      additionalProperties: false
      description: Cuerpo de `PATCH /files/{id}`; cualquier otro campo → 422 (C-8).
      properties:
        visibility:
          enum:
          - private
          - public
          title: Visibility
          type: string
      required:
      - visibility
      title: FileVisibilityUpdate
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /files:
    post:
      operationId: upload_file_files_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_files_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetaOut'
          description: Successful Response
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsafe SVG
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: File too large
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported file type
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Upload File
      tags:
      - files
  /files/{file_id}:
    get:
      operationId: get_file_files__file_id__get
      parameters:
      - in: path
        name: file_id
        required: true
        schema:
          title: File Id
          type: string
      responses:
        '200':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: File not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Get File
      tags:
      - files
    patch:
      operationId: update_visibility_files__file_id__patch
      parameters:
      - in: path
        name: file_id
        required: true
        schema:
          title: File Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileVisibilityUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetaOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: File not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Update Visibility
      tags:
      - files
