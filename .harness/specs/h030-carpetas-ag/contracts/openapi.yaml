components:
  schemas:
    AgentAccessEntryOut:
      properties:
        agent_id:
          title: Agent Id
          type: string
        carpetas:
          items:
            type: string
          title: Carpetas
          type: array
        estado:
          title: Estado
          type: string
        keys:
          items:
            $ref: '#/components/schemas/AgentAccessKeyOut'
          title: Keys
          type: array
        note_id:
          title: Note Id
          type: string
      required:
      - agent_id
      - estado
      - carpetas
      - note_id
      - keys
      title: AgentAccessEntryOut
      type: object
    AgentAccessKeyOut:
      properties:
        is_admin:
          title: Is Admin
          type: boolean
        label:
          title: Label
          type: string
      required:
      - label
      - is_admin
      title: AgentAccessKeyOut
      type: object
    AgentAccessOut:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/AgentAccessEntryOut'
          title: Agents
          type: array
        mode:
          title: Mode
          type: string
        unregistered_agent_ids:
          items:
            type: string
          title: Unregistered Agent Ids
          type: array
        unregistered_keys:
          items:
            $ref: '#/components/schemas/AgentAccessKeyOut'
          title: Unregistered Keys
          type: array
      required:
      - mode
      - agents
      - unregistered_keys
      - unregistered_agent_ids
      title: AgentAccessOut
      type: object
    AgentAccessPut:
      additionalProperties: false
      description: 'Cuerpo de `PUT /vaults/{id}/agent-access/{agent_id}`: carpetas
        con escritura (`*` = toda la bóveda salvo

        las reservadas) y estado del registro.'
      properties:
        carpetas:
          items:
            maxLength: 300
            minLength: 1
            type: string
          maxItems: 50
          title: Carpetas
          type: array
        estado:
          default: activo
          enum:
          - activo
          - suspendido
          title: Estado
          type: string
      required:
      - carpetas
      title: AgentAccessPut
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    ShadowCountOut:
      properties:
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
        count:
          title: Count
          type: integer
        decision:
          title: Decision
          type: string
        declared:
          title: Declared
          type: boolean
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      required:
      - agent_id
      - decision
      - reason
      - declared
      - count
      title: ShadowCountOut
      type: object
    ShadowDenyOut:
      properties:
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
        at:
          format: date-time
          title: At
          type: string
        op:
          title: Op
          type: string
        paths:
          items:
            type: string
          title: Paths
          type: array
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        vault_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Vault Id
      required:
      - at
      - vault_id
      - agent_id
      - op
      - paths
      - reason
      title: ShadowDenyOut
      type: object
    ShadowReportOut:
      properties:
        counts:
          items:
            $ref: '#/components/schemas/ShadowCountOut'
          title: Counts
          type: array
        hours:
          title: Hours
          type: integer
        mode:
          title: Mode
          type: string
        recent_denies:
          items:
            $ref: '#/components/schemas/ShadowDenyOut'
          title: Recent Denies
          type: array
        total:
          title: Total
          type: integer
      required:
      - mode
      - hours
      - total
      - counts
      - recent_denies
      title: ShadowReportOut
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /agent-access/shadow-report:
    get:
      description: 'Lo que el modo sombra registró: decisiones por agente y las últimas
        denegadas (solo sesión humana).'
      operationId: shadow_report_agent_access_shadow_report_get
      parameters:
      - in: query
        name: hours
        required: false
        schema:
          default: 48
          maximum: 720
          minimum: 1
          title: Hours
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowReportOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Shadow Report
      tags:
      - agent-access
  /vaults/{vault_id}/agent-access:
    get:
      description: Quién está registrado en la bóveda, con el nombre de la clave (`op-…`)
        de cada agente.
      operationId: get_agent_access_vaults__vault_id__agent_access_get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccessOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Get Agent Access
      tags:
      - agent-access
  /vaults/{vault_id}/agent-access/{agent_id}:
    delete:
      description: Quita el registro de un agente en la bóveda (solo sesión humana).
      operationId: delete_agent_access_vaults__vault_id__agent_access__agent_id__delete
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - description: Id del agente.
        in: path
        name: agent_id
        required: true
        schema:
          description: Id del agente.
          pattern: ^[a-z0-9][a-z0-9-]{0,31}$
          title: Agent Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Note not found / Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Delete Agent Access
      tags:
      - agent-access
    put:
      description: Registra o reasigna un agente en la bóveda (solo sesión humana).
      operationId: put_agent_access_vaults__vault_id__agent_access__agent_id__put
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - description: Id del agente.
        in: path
        name: agent_id
        required: true
        schema:
          description: Id del agente.
          pattern: ^[a-z0-9][a-z0-9-]{0,31}$
          title: Agent Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentAccessPut'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccessEntryOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Note path already in use
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Put Agent Access
      tags:
      - agent-access
