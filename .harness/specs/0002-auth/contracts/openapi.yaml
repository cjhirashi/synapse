components:
  schemas:
    AdminUserOut:
      properties:
        can_share_vaults:
          title: Can Share Vaults
          type: boolean
        created_at:
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deleted At
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        email:
          title: Email
          type: string
        grace:
          items:
            $ref: '#/components/schemas/GraceOut'
          title: Grace
          type: array
        id:
          title: Id
          type: string
        limits:
          $ref: '#/components/schemas/UserLimitsOut'
        must_change_password:
          title: Must Change Password
          type: boolean
        purge_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Purge At
        role:
          title: Role
          type: string
        storage_bytes:
          title: Storage Bytes
          type: integer
        vaults_used:
          anyOf:
          - type: integer
          - type: 'null'
          title: Vaults Used
      required:
      - id
      - email
      - role
      - display_name
      - must_change_password
      - created_at
      - deleted_at
      - purge_at
      - limits
      - can_share_vaults
      - vaults_used
      - storage_bytes
      - grace
      title: AdminUserOut
      type: object
    Body_put_me_photo_auth_me_photo_put:
      properties:
        file:
          format: binary
          title: File
          type: string
      required:
      - file
      title: Body_put_me_photo_auth_me_photo_put
      type: object
    ChangePasswordRequest:
      properties:
        current_password:
          title: Current Password
          type: string
        new_password:
          title: New Password
          type: string
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
      type: object
    CreateUserRequest:
      additionalProperties: false
      description: '`POST /admin/users` (H-060). Sin contraseña: la cuenta nace con
        la contraseña base. Un límite omitido toma el

        valor inicial de la plataforma; `null` lo deja sin límite.'
      properties:
        email:
          title: Email
          type: string
        max_notes_per_vault:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          default: 100
          title: Max Notes Per Vault
        max_storage_bytes_per_vault:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          default: 524288000
          title: Max Storage Bytes Per Vault
        max_vaults:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          default: 2
          title: Max Vaults
        role:
          default: guest
          enum:
          - guest
          - admin
          title: Role
          type: string
      required:
      - email
      title: CreateUserRequest
      type: object
    GraceOut:
      properties:
        deadline_at:
          title: Deadline At
          type: string
        kind:
          enum:
          - vaults
          - documents
          - storage
          title: Kind
          type: string
        vault_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Vault Id
      required:
      - kind
      - vault_id
      - deadline_at
      title: GraceOut
      type: object
    LoginRequest:
      properties:
        email:
          title: Email
          type: string
        password:
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginRequest
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    UpdateDisplayNameRequest:
      additionalProperties: false
      description: 'Cuerpo de `PATCH /auth/me`: actualiza display_name (H-028).


        Se recortan espacios; si queda vacío, se convierte a null. Máximo 80 caracteres.'
      properties:
        display_name:
          anyOf:
          - maxLength: 80
            type: string
          - type: 'null'
          title: Display Name
      title: UpdateDisplayNameRequest
      type: object
    UpdateLimitsRequest:
      additionalProperties: false
      description: '`PATCH /admin/users/{id}/limits`: solo cambian los límites enviados;
        `null` = sin límite.'
      properties:
        max_notes_per_vault:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Max Notes Per Vault
        max_storage_bytes_per_vault:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Max Storage Bytes Per Vault
        max_vaults:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Max Vaults
      title: UpdateLimitsRequest
      type: object
    UpdateRoleRequest:
      additionalProperties: false
      properties:
        role:
          enum:
          - guest
          - admin
          title: Role
          type: string
      required:
      - role
      title: UpdateRoleRequest
      type: object
    UpdateSharingRequest:
      additionalProperties: false
      properties:
        can_share_vaults:
          title: Can Share Vaults
          type: boolean
      required:
      - can_share_vaults
      title: UpdateSharingRequest
      type: object
    UserLimitsOut:
      properties:
        max_notes_per_vault:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Notes Per Vault
        max_storage_bytes_per_vault:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Storage Bytes Per Vault
        max_vaults:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Vaults
      required:
      - max_vaults
      - max_notes_per_vault
      - max_storage_bytes_per_vault
      title: UserLimitsOut
      type: object
    UserUsageOut:
      description: '`GET /admin/users/{id}/usage`: lo que la cuenta usa hoy, por bóveda
        y en total. Cuesta recorrer sus notas en CouchDB,

        por eso va aparte del listado.'
      properties:
        documents_total:
          title: Documents Total
          type: integer
        storage_bytes_total:
          title: Storage Bytes Total
          type: integer
        vaults:
          items:
            $ref: '#/components/schemas/VaultUsageOut'
          title: Vaults
          type: array
      required:
      - vaults
      - documents_total
      - storage_bytes_total
      title: UserUsageOut
      type: object
    VaultUsageOut:
      description: 'Uso de una bóveda de la cuenta vista por un administrador. El
        nombre y el id de la bóveda son privados de la persona:

        se identifica con un alias («Bóveda 1», «Bóveda 2»…) por orden de creación.'
      properties:
        alias:
          title: Alias
          type: string
        documents:
          title: Documents
          type: integer
        storage_bytes:
          title: Storage Bytes
          type: integer
      required:
      - alias
      - documents
      - storage_bytes
      title: VaultUsageOut
      type: object
