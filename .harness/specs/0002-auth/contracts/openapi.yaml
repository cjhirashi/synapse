components:
  schemas:
    ChangePasswordRequest:
      properties:
        current_password:
          title: Current Password
          type: string
        new_password:
          title: New Password
          type: string
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
      type: object
    CreateUserRequest:
      properties:
        email:
          minLength: 3
          title: Email
          type: string
        password:
          minLength: 1
          title: Password
          type: string
      required:
      - email
      - password
      title: CreateUserRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LoginRequest:
      properties:
        email:
          title: Email
          type: string
        password:
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginRequest
      type: object
    UserResponse:
      properties:
        email:
          title: Email
          type: string
        id:
          title: Id
          type: string
        role:
          title: Role
          type: string
      required:
      - id
      - email
      - role
      title: UserResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /admin/users:
    post:
      operationId: create_user_admin_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create User
      tags:
      - admin
  /auth/change-password:
    post:
      operationId: change_password_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Change Password
      tags:
      - auth
  /auth/login:
    post:
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      operationId: logout_auth_logout_post
      responses:
        '204':
          description: Successful Response
      summary: Logout
      tags:
      - auth
  /auth/me:
    get:
      operationId: me_auth_me_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Me
      tags:
      - auth
  /auth/refresh:
    post:
      operationId: refresh_auth_refresh_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Refresh
      tags:
      - auth
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
