components:
  schemas:
    AgentProfileListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentProfileOut'
          title: Items
          type: array
      required:
      - items
      title: AgentProfileListOut
      type: object
    AgentProfileOut:
      properties:
        agent_id:
          title: Agent Id
          type: string
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        photo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Photo Url
      required:
      - agent_id
      - display_name
      - photo_url
      title: AgentProfileOut
      type: object
    AgentProfilePut:
      additionalProperties: false
      description: 'Cuerpo de `PUT /agent-profiles/{agent_id}`: el nombre visible
        (`null` o vacío = volver al id del agente).'
      properties:
        display_name:
          anyOf:
          - maxLength: 60
            type: string
          - type: 'null'
          title: Display Name
      title: AgentProfilePut
      type: object
    Body_put_photo_agent_profiles__agent_id__photo_put:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
      required:
      - file
      title: Body_put_photo_agent_profiles__agent_id__photo_put
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /agent-profiles:
    get:
      operationId: list_profiles_agent_profiles_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileListOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: List Profiles
      tags:
      - agent-profiles
  /agent-profiles/{agent_id}:
    put:
      operationId: put_profile_agent_profiles__agent_id__put
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          pattern: ^[a-z0-9][a-z0-9-]{0,31}$
          title: Agent Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProfilePut'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfileOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Put Profile
      tags:
      - agent-profiles
  /agent-profiles/{agent_id}/photo:
