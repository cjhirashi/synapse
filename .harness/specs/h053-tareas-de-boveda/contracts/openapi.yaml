components:
  schemas:
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    TaskCreate:
      additionalProperties: false
      description: Cuerpo de `POST /vaults/{id}/tasks` (y de `.../tasks/{task_id}/subtasks`,
        donde `parent_id` lo pone la ruta).
      properties:
        assignee_agent_id:
          anyOf:
          - pattern: ^[a-z0-9][a-z0-9-]{0,31}$
            type: string
          - type: 'null'
          title: Assignee Agent Id
        assignee_type:
          default: user
          enum:
          - user
          - agent
          title: Assignee Type
          type: string
        blocked_by:
          anyOf:
          - items:
              maxLength: 64
              minLength: 1
              type: string
            maxItems: 30
            type: array
          - type: 'null'
          title: Blocked By
        description:
          anyOf:
          - maxLength: 20000
            type: string
          - type: 'null'
          title: Description
        due_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due At
        notes:
          anyOf:
          - maxLength: 20000
            type: string
          - type: 'null'
          title: Notes
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
        path:
          anyOf:
          - maxLength: 600
            type: string
          - type: 'null'
          title: Path
        priority:
          default: medium
          enum:
          - low
          - medium
          - high
          title: Priority
          type: string
        project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
        reminders:
          anyOf:
          - items:
              maximum: 40320.0
              minimum: 1.0
              type: integer
            type: array
          - type: 'null'
          title: Reminders
        sort_order:
          anyOf:
          - maximum: 100000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Sort Order
        start_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Start At
        status:
          default: pending
          enum:
          - pending
          - in_progress
          - done
          - cancelled
          title: Status
          type: string
        title:
          maxLength: 255
          minLength: 1
          title: Title
          type: string
      required:
      - title
      title: TaskCreate
      type: object
    TaskListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TaskOut'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: TaskListOut
      type: object
    TaskOut:
      description: Una tarea (raíz o subtarea; la jerarquía va en `parent_id`). Fechas
        en UTC con `Z`.
      properties:
        assignee_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee Agent Id
        assignee_type:
          title: Assignee Type
          type: string
        blocked:
          default: false
          title: Blocked
          type: boolean
        blocked_by:
          default: []
          items:
            type: string
          title: Blocked By
          type: array
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
        created_at:
          title: Created At
          type: string
        created_by:
          title: Created By
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        due_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Due At
        id:
          title: Id
          type: string
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
        priority:
          title: Priority
          type: string
        project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
        purge_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Purge At
        reminders:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Reminders
        sort_order:
          title: Sort Order
          type: integer
        start_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Start At
        status:
          title: Status
          type: string
        title:
          title: Title
          type: string
        updated_at:
          title: Updated At
          type: string
        updated_by:
          title: Updated By
          type: string
        vault_id:
          title: Vault Id
          type: string
        version:
          title: Version
          type: integer
      required:
      - id
      - vault_id
      - parent_id
      - sort_order
      - title
      - description
      - notes
      - status
      - priority
      - due_at
      - assignee_type
      - assignee_agent_id
      - path
      - created_by
      - updated_by
      - version
      - created_at
      - updated_at
      - completed_at
      title: TaskOut
      type: object
    TaskUpdate:
      additionalProperties: false
      description: 'Cuerpo de `PATCH /vaults/{id}/tasks/{task_id}`: solo cambia lo
        enviado (un `null` explícito vacía el campo).'
      properties:
        assignee_agent_id:
          anyOf:
          - pattern: ^[a-z0-9][a-z0-9-]{0,31}$
            type: string
          - type: 'null'
          title: Assignee Agent Id
        assignee_type:
          anyOf:
          - enum:
            - user
            - agent
            type: string
          - type: 'null'
          title: Assignee Type
        blocked_by:
          anyOf:
          - items:
              maxLength: 64
              minLength: 1
              type: string
            maxItems: 30
            type: array
          - type: 'null'
          title: Blocked By
        description:
          anyOf:
          - maxLength: 20000
            type: string
          - type: 'null'
          title: Description
        due_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due At
        notes:
          anyOf:
          - maxLength: 20000
            type: string
          - type: 'null'
          title: Notes
        path:
          anyOf:
          - maxLength: 600
            type: string
          - type: 'null'
          title: Path
        priority:
          anyOf:
          - enum:
            - low
            - medium
            - high
            type: string
          - type: 'null'
          title: Priority
        project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
        reminders:
          anyOf:
          - items:
              maximum: 40320.0
              minimum: 1.0
              type: integer
            type: array
          - type: 'null'
          title: Reminders
        sort_order:
          anyOf:
          - maximum: 100000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Sort Order
        start_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Start At
        status:
          anyOf:
          - enum:
            - pending
            - in_progress
            - done
            - cancelled
            type: string
          - type: 'null'
          title: Status
        title:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      title: TaskUpdate
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /tasks:
    get:
      description: Tareas del dueño en todas sus bóvedas (p. ej. «mis tareas» o las
        pendientes de un agente).
      operationId: list_my_tasks_tasks_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Status
      - description: '`user` o el id de un agente'
        in: query
        name: assignee
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`user` o el id de un agente'
          title: Assignee
      - in: query
        name: due_after
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due After
      - in: query
        name: due_before
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due Before
      - description: Id de un proyecto, o `none` para las tareas sin proyecto
        in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Id de un proyecto, o `none` para las tareas sin proyecto
          title: Project Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: List My Tasks
      tags:
      - tasks
  /vaults/{vault_id}/tasks:
    get:
      description: 'Tareas de la bóveda (raíces y subtareas, planas: la jerarquía
        va en `parent_id`).'
      operationId: list_vault_tasks_vaults__vault_id__tasks_get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Status
      - description: '`user` o el id de un agente'
        in: query
        name: assignee
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`user` o el id de un agente'
          title: Assignee
      - in: query
        name: due_after
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due After
      - in: query
        name: due_before
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due Before
      - description: Id de un proyecto, o `none` para las tareas sin proyecto
        in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Id de un proyecto, o `none` para las tareas sin proyecto
          title: Project Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: List Vault Tasks
      tags:
      - tasks
    post:
      operationId: create_task_vaults__vault_id__tasks_post
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión de la tarea; se envía en `If-Match`.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Task not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Create Task
      tags:
      - tasks
  /vaults/{vault_id}/tasks/{task_id}:
    delete:
      description: Borra la tarea y, si es una raíz, sus subtareas.
      operationId: delete_task_vaults__vault_id__tasks__task_id__delete
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Task not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Delete Task
      tags:
      - tasks
    get:
      operationId: get_task_vaults__vault_id__tasks__task_id__get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión de la tarea; se envía en `If-Match`.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Task not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Get Task
      tags:
      - tasks
    patch:
      description: 'Cambia solo lo enviado. `If-Match` (la `version` vigente) es opcional:
        con él, un cambio ajeno da 412.'
      operationId: update_task_vaults__vault_id__tasks__task_id__patch
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: string
      - in: header
        name: if-match
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión de la tarea; se envía en `If-Match`.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Task not found
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Task precondition failed
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Update Task
      tags:
      - tasks
  /vaults/{vault_id}/tasks/{task_id}/subtasks:
    post:
      description: 'Crea una subtarea bajo la raíz `task_id` (el `parent_id` del cuerpo
        se ignora: manda la ruta).'
      operationId: create_subtask_vaults__vault_id__tasks__task_id__subtasks_post
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión de la tarea; se envía en `If-Match`.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Task not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Create Subtask
      tags:
      - tasks
