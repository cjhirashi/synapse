components:
  schemas:
    NotificationListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/NotificationOut'
          title: Items
          type: array
        unread:
          title: Unread
          type: integer
      required:
      - items
      - unread
      title: NotificationListOut
      type: object
    NotificationOut:
      properties:
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        created_at:
          title: Created At
          type: string
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        read_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Read At
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        resource_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Type
        title:
          title: Title
          type: string
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        vault_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Vault Id
      required:
      - id
      - kind
      - title
      - body
      - vault_id
      - resource_type
      - resource_id
      - url
      - read_at
      - created_at
      title: NotificationOut
      type: object
    NotificationPrefsOut:
      description: 'Tipos de aviso y si están activos: `task_assigned`, `task_status`,
        `task_due`.'
      properties:
        kinds:
          additionalProperties:
            type: boolean
          title: Kinds
          type: object
      required:
      - kinds
      title: NotificationPrefsOut
      type: object
    NotificationPrefsPut:
      additionalProperties: false
      description: 'Cuerpo de `PUT /notifications/preferences`: solo cambia los tipos
        enviados.'
      properties:
        kinds:
          additionalProperties:
            type: boolean
          propertyNames:
            enum:
            - task_assigned
            - task_status
            - task_due
          title: Kinds
          type: object
      required:
      - kinds
      title: NotificationPrefsPut
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    UnreadCountOut:
      properties:
        count:
          title: Count
          type: integer
      required:
      - count
      title: UnreadCountOut
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /notifications:
    get:
      operationId: list_notifications_notifications_get
      parameters:
      - in: query
        name: unread
        required: false
        schema:
          default: false
          title: Unread
          type: boolean
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: List Notifications
      tags:
      - notifications
  /notifications/preferences:
    get:
      operationId: get_preferences_notifications_preferences_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPrefsOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Get Preferences
      tags:
      - notifications
    put:
      operationId: put_preferences_notifications_preferences_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPrefsPut'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPrefsOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Put Preferences
      tags:
      - notifications
  /notifications/read-all:
    post:
      operationId: read_all_notifications_read_all_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Read All
      tags:
      - notifications
  /notifications/unread-count:
    get:
      operationId: unread_count_notifications_unread_count_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Unread Count
      tags:
      - notifications
  /notifications/{notification_id}/read:
    post:
      operationId: mark_read_notifications__notification_id__read_post
      parameters:
      - in: path
        name: notification_id
        required: true
        schema:
          title: Notification Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Notification not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Mark Read
      tags:
      - notifications
