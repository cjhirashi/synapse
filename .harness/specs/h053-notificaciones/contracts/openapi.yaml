components:
  schemas:
    NoticeTaskOut:
      description: La tarea a la que se refiere un aviso, tal como está ahora (no
        al crearse el aviso).
      properties:
        assignee_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee Agent Id
        assignee_type:
          title: Assignee Type
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        due_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Due At
        id:
          title: Id
          type: string
        priority:
          title: Priority
          type: string
        status:
          title: Status
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - description
      - status
      - priority
      - due_at
      - assignee_type
      - assignee_agent_id
      title: NoticeTaskOut
      type: object
    NotificationListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/NotificationOut'
          title: Items
          type: array
        unread:
          title: Unread
          type: integer
      required:
      - items
      - unread
      title: NotificationListOut
      type: object
    NotificationOut:
      properties:
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        created_at:
          title: Created At
          type: string
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        read_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Read At
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        resource_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Type
        task:
          anyOf:
          - $ref: '#/components/schemas/NoticeTaskOut'
          - type: 'null'
        title:
          title: Title
          type: string
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        vault_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Vault Id
      required:
      - id
      - kind
      - title
      - body
      - vault_id
      - resource_type
      - resource_id
      - url
      - read_at
      - created_at
      title: NotificationOut
      type: object
    NotificationPrefsOut:
      description: Tipos de aviso y si están activos (`task_assigned`, `task_status`,
        `task_due`, `publication_expired`) y las horas silenciosas.
      properties:
        kinds:
          additionalProperties:
            type: boolean
          title: Kinds
          type: object
        quiet:
          $ref: '#/components/schemas/QuietHours'
      required:
      - kinds
      - quiet
      title: NotificationPrefsOut
      type: object
    NotificationPrefsPut:
      additionalProperties: false
      description: 'Cuerpo de `PUT /notifications/preferences`: solo cambia los tipos
        enviados.'
      properties:
        kinds:
          additionalProperties:
            type: boolean
          default: {}
          propertyNames:
            enum:
            - task_assigned
            - task_status
            - task_due
            - publication_expired
            - limit_grace
            - vault_share
          title: Kinds
          type: object
        quiet:
          anyOf:
          - $ref: '#/components/schemas/QuietHours'
          - type: 'null'
      title: NotificationPrefsPut
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    PushKeys:
      additionalProperties: false
      properties:
        auth:
          maxLength: 100
          minLength: 1
          title: Auth
          type: string
        p256dh:
          maxLength: 200
          minLength: 1
          title: P256Dh
          type: string
      required:
      - p256dh
      - auth
      title: PushKeys
      type: object
    PushStatusOut:
      description: 'Estado del push: si el servidor lo tiene configurado, la clave
        pública para suscribirse y los dispositivos de la persona.'
      properties:
        devices:
          title: Devices
          type: integer
        enabled:
          title: Enabled
          type: boolean
        public_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Key
      required:
      - enabled
      - public_key
      - devices
      title: PushStatusOut
      type: object
    PushSubscriptionIn:
      description: Suscripción tal como la entrega `PushSubscription.toJSON()` del
        navegador.
      properties:
        endpoint:
          maxLength: 2000
          minLength: 1
          title: Endpoint
          type: string
        keys:
          $ref: '#/components/schemas/PushKeys'
      required:
      - endpoint
      - keys
      title: PushSubscriptionIn
      type: object
    PushTestOut:
      properties:
        failed:
          title: Failed
          type: integer
        removed:
          title: Removed
          type: integer
        sent:
          title: Sent
          type: integer
      required:
      - sent
      - removed
      - failed
      title: PushTestOut
      type: object
    QuietHours:
      additionalProperties: false
      description: Horas silenciosas del push (America/Mexico_City, HH:MM). Solo suprimen
        el envío al dispositivo; el aviso sigue en la bandeja.
      properties:
        enabled:
          title: Enabled
          type: boolean
        end:
          title: End
          type: string
        start:
          title: Start
          type: string
      required:
      - enabled
      - start
      - end
      title: QuietHours
      type: object
    UnreadCountOut:
      properties:
        count:
          title: Count
          type: integer
      required:
      - count
      title: UnreadCountOut
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /notifications:
    get:
      operationId: list_notifications_notifications_get
      parameters:
      - in: query
        name: unread
        required: false
        schema:
          default: false
          title: Unread
          type: boolean
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: List Notifications
      tags:
      - notifications
  /notifications/preferences:
    get:
      operationId: get_preferences_notifications_preferences_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPrefsOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Get Preferences
      tags:
      - notifications
    put:
      operationId: put_preferences_notifications_preferences_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPrefsPut'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPrefsOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Put Preferences
      tags:
      - notifications
  /notifications/push:
    get:
      operationId: push_status_notifications_push_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushStatusOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Push Status
      tags:
      - notifications
  /notifications/push/subscription:
    delete:
      operationId: delete_subscription_notifications_push_subscription_delete
      parameters:
      - in: query
        name: endpoint
        required: true
        schema:
          maxLength: 2000
          minLength: 1
          title: Endpoint
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Delete Subscription
      tags:
      - notifications
    put:
      operationId: put_subscription_notifications_push_subscription_put
      parameters:
      - in: header
        name: user-agent
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User-Agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Put Subscription
      tags:
      - notifications
  /notifications/push/test:
    post:
      operationId: push_test_notifications_push_test_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushTestOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Push Test
      tags:
      - notifications
  /notifications/read-all:
    post:
      operationId: read_all_notifications_read_all_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Read All
      tags:
      - notifications
  /notifications/unread-count:
    get:
      operationId: unread_count_notifications_unread_count_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Unread Count
      tags:
      - notifications
  /notifications/{notification_id}/read:
    post:
      operationId: mark_read_notifications__notification_id__read_post
      parameters:
      - in: path
        name: notification_id
        required: true
        schema:
          title: Notification Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Notification not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Mark Read
      tags:
      - notifications
