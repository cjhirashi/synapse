components:
  schemas:
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    VaultCreate:
      additionalProperties: false
      description: Cuerpo de `POST /vaults`; cualquier otro campo → 422 (RF-023).
      properties:
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Description
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        tags:
          items:
            maxLength: 32
            minLength: 1
            type: string
          maxItems: 20
          title: Tags
          type: array
      required:
      - name
      title: VaultCreate
      type: object
    VaultListItem:
      properties:
        created_at:
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deleted At
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        etag:
          title: Etag
          type: string
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        owner_id:
          title: Owner Id
          type: string
        tags:
          items:
            type: string
          title: Tags
          type: array
        updated_at:
          title: Updated At
          type: string
      required:
      - id
      - name
      - description
      - tags
      - owner_id
      - created_at
      - updated_at
      - deleted_at
      - etag
      title: VaultListItem
      type: object
    VaultOut:
      properties:
        created_at:
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deleted At
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        owner_id:
          title: Owner Id
          type: string
        tags:
          items:
            type: string
          title: Tags
          type: array
        updated_at:
          title: Updated At
          type: string
      required:
      - id
      - name
      - description
      - tags
      - owner_id
      - created_at
      - updated_at
      - deleted_at
      title: VaultOut
      type: object
    VaultPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/VaultListItem'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      - next_cursor
      title: VaultPage
      type: object
    VaultUpdate:
      additionalProperties: false
      description: 'Cuerpo de `PATCH /vaults/{id}`: se aplican sólo los campos enviados
        (RF-009).


        `name` y `tags` no admiten `null`: su tipo no es anulable y el valor por defecto
        `None`

        no se valida (pydantic no valida defaults), así que "ausente" se distingue
        de un

        `null` explícito, que da 422. `description: null` sí vale: borra la descripción.

        Se lee con `model_dump(exclude_unset=True)`.'
      properties:
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Description
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        tags:
          items:
            maxLength: 32
            minLength: 1
            type: string
          maxItems: 20
          title: Tags
          type: array
      title: VaultUpdate
      type: object
