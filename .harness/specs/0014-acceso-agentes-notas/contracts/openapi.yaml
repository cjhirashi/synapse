components:
  schemas:
    NoteCreate:
      additionalProperties: false
      description: 'Cuerpo de `POST /vaults/{vault_id}/notes`; cualquier otro campo
        → 422 (C-5, mismo

        vocabulario `validation-error:<campo>` que `core/schemas.py` ya usa para bóvedas).


        `frontmatter` ausente o `null` son equivalentes (sin frontmatter): el servicio
        escribe el

        documento **sin la clave** en los dos casos, nunca con `frontmatter: null`
        (contrato

        `note.schema.json` de SPEC-0008, el mismo que valida el push: una clave presente
        con

        `null` la rechazaría `check_frontmatter`, C-10). `null` nunca pasa por esa
        regla porque el

        documento que persiste el servicio no llega a tener esa forma.'
      properties:
        content:
          title: Content
          type: string
        frontmatter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Frontmatter
        path:
          title: Path
          type: string
      required:
      - path
      - content
      title: NoteCreate
      type: object
    NoteListItem:
      properties:
        created_at:
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deleted At
        etag:
          title: Etag
          type: string
        id:
          title: Id
          type: string
        path:
          title: Path
          type: string
        updated_at:
          title: Updated At
          type: string
        vault_id:
          title: Vault Id
          type: string
      required:
      - id
      - vault_id
      - path
      - created_at
      - updated_at
      - deleted_at
      - etag
      title: NoteListItem
      type: object
    NoteOut:
      properties:
        content:
          title: Content
          type: string
        created_at:
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deleted At
        frontmatter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Frontmatter
        id:
          title: Id
          type: string
        path:
          title: Path
          type: string
        updated_at:
          title: Updated At
          type: string
        vault_id:
          title: Vault Id
          type: string
      required:
      - id
      - vault_id
      - path
      - frontmatter
      - content
      - created_at
      - updated_at
      - deleted_at
      title: NoteOut
      type: object
    NotePage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/NoteListItem'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      - next_cursor
      title: NotePage
      type: object
    NoteUpdate:
      additionalProperties: false
      description: 'Cuerpo de `PATCH /vaults/{vault_id}/notes/{note_id}`: se aplican
        sólo los campos

        enviados (`model_dump(exclude_unset=True)`, mismo patrón que `VaultUpdate`).


        `path` y `content` no admiten `null` (su tipo no es anulable): "ausente" se
        distingue de

        un `null` explícito, que da 422. `frontmatter: null` sí vale: borra el campo
        (como

        `description` en `VaultUpdate`).'
      properties:
        content:
          title: Content
          type: string
        frontmatter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Frontmatter
        path:
          title: Path
          type: string
      title: NoteUpdate
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
