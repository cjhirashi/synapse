components:
  schemas:
    NoteListItem:
      properties:
        created_at:
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deleted At
        etag:
          title: Etag
          type: string
        id:
          title: Id
          type: string
        path:
          title: Path
          type: string
        updated_at:
          title: Updated At
          type: string
        vault_id:
          title: Vault Id
          type: string
      required:
      - id
      - vault_id
      - path
      - created_at
      - updated_at
      - deleted_at
      - etag
      title: NoteListItem
      type: object
    NoteOut:
      properties:
        content:
          title: Content
          type: string
        created_at:
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deleted At
        frontmatter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Frontmatter
        id:
          title: Id
          type: string
        path:
          title: Path
          type: string
        updated_at:
          title: Updated At
          type: string
        vault_id:
          title: Vault Id
          type: string
      required:
      - id
      - vault_id
      - path
      - frontmatter
      - content
      - created_at
      - updated_at
      - deleted_at
      title: NoteOut
      type: object
    NotePage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/NoteListItem'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      - next_cursor
      title: NotePage
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /vaults/{vault_id}/notes:
    get:
      operationId: list_notes_vaults__vault_id__notes_get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: deleted
        required: false
        schema:
          default: false
          title: Deleted
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotePage'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: List Notes
      tags:
      - notes
  /vaults/{vault_id}/notes/{note_id}:
    get:
      operationId: get_note_vaults__vault_id__notes__note_id__get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: note_id
        required: true
        schema:
          format: uuid
          title: Note Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión de la nota; se envía en `If-Match`.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Note not found / Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Get Note
      tags:
      - notes
