components:
  schemas:
    FolderMove:
      additionalProperties: false
      description: 'Cuerpo de `POST /vaults/{vault_id}/folders/move` (H-039): rutas
        de carpeta, sin `INDICE.md` ni nombre de archivo.'
      properties:
        from:
          examples:
          - Proyectos/2025
          title: From
          type: string
        to:
          examples:
          - Archivo/Proyectos 2025
          title: To
          type: string
      required:
      - from
      - to
      title: FolderMove
      type: object
    FolderMoveOut:
      description: 'Resultado de mover una carpeta: notas movidas y wikilinks reescritos
        en la bóveda.'
      properties:
        from:
          title: From
          type: string
        moved_notes:
          title: Moved Notes
          type: integer
        rewrite:
          $ref: '#/components/schemas/WikilinkRewriteOut'
        to:
          title: To
          type: string
      required:
      - from
      - to
      - moved_notes
      - rewrite
      title: FolderMoveOut
      type: object
    NoteCreate:
      additionalProperties: false
      description: 'Cuerpo de `POST /vaults/{vault_id}/notes`; cualquier otro campo
        → 422 (C-5, mismo

        vocabulario `validation-error:<campo>` que `core/schemas.py` ya usa para bóvedas).


        `frontmatter` ausente o `null` son equivalentes (sin frontmatter): el servicio
        escribe el

        documento **sin la clave** en los dos casos, nunca con `frontmatter: null`
        (contrato

        `note.schema.json` de SPEC-0008, el mismo que valida el push: una clave presente
        con

        `null` la rechazaría `check_frontmatter`, C-10). `null` nunca pasa por esa
        regla porque el

        documento que persiste el servicio no llega a tener esa forma.'
      properties:
        content:
          title: Content
          type: string
        frontmatter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Frontmatter
        path:
          title: Path
          type: string
      required:
      - path
      - content
      title: NoteCreate
      type: object
    NoteListItem:
      properties:
        created_at:
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deleted At
        etag:
          title: Etag
          type: string
        frontmatter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Frontmatter
        id:
          title: Id
          type: string
        path:
          title: Path
          type: string
        updated_at:
          title: Updated At
          type: string
        vault_id:
          title: Vault Id
          type: string
      required:
      - id
      - vault_id
      - path
      - frontmatter
      - created_at
      - updated_at
      - deleted_at
      - etag
      title: NoteListItem
      type: object
    NoteOut:
      properties:
        content:
          title: Content
          type: string
        created_at:
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deleted At
        frontmatter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Frontmatter
        id:
          title: Id
          type: string
        path:
          title: Path
          type: string
        updated_at:
          title: Updated At
          type: string
        vault_id:
          title: Vault Id
          type: string
      required:
      - id
      - vault_id
      - path
      - frontmatter
      - content
      - created_at
      - updated_at
      - deleted_at
      title: NoteOut
      type: object
    NotePage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/NoteListItem'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      - next_cursor
      title: NotePage
      type: object
    NoteUpdate:
      additionalProperties: false
      description: 'Cuerpo de `PATCH /vaults/{vault_id}/notes/{note_id}`: se aplican
        sólo los campos

        enviados (`model_dump(exclude_unset=True)`, mismo patrón que `VaultUpdate`).


        `path` y `content` no admiten `null` (su tipo no es anulable): "ausente" se
        distingue de

        un `null` explícito, que da 422. `frontmatter: null` sí vale: borra el campo
        (como

        `description` en `VaultUpdate`).'
      properties:
        content:
          title: Content
          type: string
        frontmatter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Frontmatter
        path:
          title: Path
          type: string
      title: NoteUpdate
      type: object
    PdfIn:
      additionalProperties: false
      description: HTML del documento tal como la app lo dibuja en Lectura (H-036).
        El servidor lo vuelve a limpiar; los estilos salen de la plantilla.
      properties:
        html:
          maxLength: 5000000
          title: Html
          type: string
      required:
      - html
      title: PdfIn
      type: object
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    PublicationCheckOut:
      description: Resultado de la comprobación de recursos de una publicación (H-035).
      properties:
        external:
          items:
            type: string
          title: External
          type: array
        has_private:
          title: Has Private
          type: boolean
        resources:
          items:
            $ref: '#/components/schemas/PublicationResource'
          title: Resources
          type: array
      required:
      - resources
      - external
      - has_private
      title: PublicationCheckOut
      type: object
    PublicationExpiryIn:
      additionalProperties: false
      description: Cuerpo de PUT para fijar fecha de vencimiento de publicación (H-037).
      properties:
        unpublish_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Unpublish At
      required:
      - unpublish_at
      title: PublicationExpiryIn
      type: object
    PublicationListItem:
      description: Un elemento del listado de publicaciones (H-037).
      properties:
        deleted:
          title: Deleted
          type: boolean
        note_id:
          title: Note Id
          type: string
        note_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Note Path
        path:
          title: Path
          type: string
        published_at:
          title: Published At
          type: string
        republished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Republished At
        stale:
          title: Stale
          type: boolean
        title:
          title: Title
          type: string
        token:
          title: Token
          type: string
        unpublish_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Unpublish At
      required:
      - note_id
      - note_path
      - title
      - token
      - path
      - published_at
      - republished_at
      - unpublish_at
      - stale
      - deleted
      title: PublicationListItem
      type: object
    PublicationListOut:
      description: Listado de publicaciones del usuario (H-037).
      properties:
        items:
          items:
            $ref: '#/components/schemas/PublicationListItem'
          title: Items
          type: array
      required:
      - items
      title: PublicationListOut
      type: object
    PublicationOut:
      description: Estado de publicación de una nota (H-035).
      properties:
        enabled:
          title: Enabled
          type: boolean
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
        published:
          title: Published
          type: boolean
        published_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Published At
        republished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Republished At
        stale:
          title: Stale
          type: boolean
        token:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
        unpublish_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Unpublish At
      required:
      - enabled
      - published
      - token
      - path
      - published_at
      - republished_at
      - unpublish_at
      - stale
      title: PublicationOut
      type: object
    PublicationResource:
      description: Recurso encontrado en una publicación (H-035, fase 2 comprobación).
      properties:
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
        id:
          title: Id
          type: string
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        visibility:
          enum:
          - public
          - private
          - missing
          title: Visibility
          type: string
      required:
      - id
      - name
      - content_type
      - visibility
      title: PublicationResource
      type: object
    PublishCreateIn:
      additionalProperties: false
      description: 'Cuerpo de POST para publicar una nota: añade campo de vencimiento
        (H-037).'
      properties:
        html:
          maxLength: 2000000
          minLength: 1
          title: Html
          type: string
        unpublish_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Unpublish At
      required:
      - html
      title: PublishCreateIn
      type: object
    PublishIn:
      additionalProperties: false
      description: HTML del documento para publicar en `/p/<token>` (H-035). El servidor
        lo limpia; metadatos salen del frontmatter y la plantilla.
      properties:
        html:
          maxLength: 2000000
          minLength: 1
          title: Html
          type: string
      required:
      - html
      title: PublishIn
      type: object
    WikilinkRewriteOut:
      properties:
        ambiguous:
          title: Ambiguous
          type: integer
        links:
          title: Links
          type: integer
        notes:
          title: Notes
          type: integer
        pending:
          title: Pending
          type: integer
      required:
      - notes
      - links
      - ambiguous
      - pending
      title: WikilinkRewriteOut
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /vaults/{vault_id}/folders/move:
    post:
      operationId: move_folder_vaults__vault_id__folders_move_post
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderMove'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderMoveOut'
          description: Successful Response
          headers:
            X-Wikilinks-Rewritten:
              description: '`notes=<n>; links=<m>; ambiguous=<k>; pending=<p>`'
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Folder not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Note path already in use
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Wikilink rewrite conflict
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Move Folder
      tags:
      - folders
  /vaults/{vault_id}/notes:
    get:
      operationId: list_notes_vaults__vault_id__notes_get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: deleted
        required: false
        schema:
          default: false
          title: Deleted
          type: boolean
      - description: 'Carpeta (sin barra final): lista solo las notas bajo ella, ordenadas
          por ruta. Sin `prefix` el orden es por fecha de creación descendente.'
        in: query
        name: prefix
        required: false
        schema:
          anyOf:
          - maxLength: 300
            type: string
          - type: 'null'
          description: 'Carpeta (sin barra final): lista solo las notas bajo ella,
            ordenadas por ruta. Sin `prefix` el orden es por fecha de creación descendente.'
          title: Prefix
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotePage'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: List Notes
      tags:
      - notes
    post:
      operationId: create_note_vaults__vault_id__notes_post
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión de la nota; se envía en `If-Match`.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Note path already in use
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Create Note
      tags:
      - notes
  /vaults/{vault_id}/notes/{note_id}:
    delete:
      operationId: delete_note_vaults__vault_id__notes__note_id__delete
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: note_id
        required: true
        schema:
          format: uuid
          title: Note Id
          type: string
      - in: header
        name: if-match
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Note not found / Vault not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent owns skills
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Precondition failed
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '428':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Precondition required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Delete Note
      tags:
      - notes
    get:
      operationId: get_note_vaults__vault_id__notes__note_id__get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: note_id
        required: true
        schema:
          format: uuid
          title: Note Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión de la nota; se envía en `If-Match`.
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Note not found / Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Get Note
      tags:
      - notes
    patch:
      operationId: update_note_vaults__vault_id__notes__note_id__patch
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: note_id
        required: true
        schema:
          format: uuid
          title: Note Id
          type: string
      - in: header
        name: if-match
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteOut'
          description: Successful Response
          headers:
            ETag:
              description: Versión de la nota; se envía en `If-Match`.
              schema:
                type: string
            X-Wikilinks-Rewritten:
              description: 'Solo si el PATCH cambió `path`: wikilinks reescritos en
                la bóveda, `notes=<n>; links=<m>; ambiguous=<k>; pending=<p>`.'
              schema:
                type: string
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Agent access denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Note not found / Vault not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Note path already in use / Agent owns skills
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Precondition failed
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '428':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Precondition required
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Storage unavailable
      summary: Update Note
      tags:
      - notes
  /vaults/{vault_id}/notes/{note_id}/pdf:
    post:
      description: 'PDF de un documento (H-036). Solo la persona (sesión): el HTML
        es el de Lectura y el formato sale de la plantilla del documento.'
      operationId: note_pdf_vaults__vault_id__notes__note_id__pdf_post
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: note_id
        required: true
        schema:
          format: uuid
          title: Note Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PdfIn'
        required: true
      responses:
        '200':
          content:
            application/pdf:
              schema:
                format: binary
                type: string
          description: El documento como PDF.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
