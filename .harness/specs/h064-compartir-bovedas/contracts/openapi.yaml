components:
  schemas:
    BulkDocsRequest:
      additionalProperties: false
      description: 'Lote del replicador. `new_edits` debe ser `false`: el canal sólo
        replica revisiones.'
      properties:
        docs:
          items:
            additionalProperties: true
            type: object
          title: Docs
          type: array
        new_edits:
          const: false
          title: New Edits
          type: boolean
      required:
      - docs
      - new_edits
      title: BulkDocsRequest
      type: object
    JsonValue: {}
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    SharedBulkDocsRejection:
      additionalProperties: false
      description: 'Revisión rechazada en el push de un invitado: añade los motivos
        `share-forbidden:*`.'
      properties:
        error:
          const: forbidden
          title: Error
          type: string
        id:
          $ref: '#/components/schemas/JsonValue'
          description: '`_id` tal como lo envió el cliente.'
        reason:
          pattern: ^(invalid-id|owner-mismatch|immutable-field:created_at|vault-name-taken|note-path-taken|vault-not-found|delete-not-allowed|reserved-name:.+|index-readonly:.+|index-root:.+|meta-folder:.+|ag-mensajes:.+|ag-agentes:.+|immutable-field:cerrada_el|agent-access-denied|bitacora:.+|plantilla:.+|sistema:.+|skill:.+|vault-limit-reached|document-limit-reached|share-forbidden:(?:vault|path|move)|validation-error:.+|not-normalized:.+)$
          title: Reason
          type: string
        rev:
          $ref: '#/components/schemas/JsonValue'
          description: '`_rev` tal como lo envió el cliente.'
      required:
      - id
      - rev
      - error
      - reason
      title: SharedBulkDocsRejection
      type: object
    VaultInvitationOut:
      description: Invitación o membresía del usuario (vista desde el invitado).
      properties:
        created_at:
          title: Created At
          type: string
        grants:
          default: []
          items:
            $ref: '#/components/schemas/VaultMemberGrantOut'
          title: Grants
          type: array
        id:
          title: Id
          type: string
        owner:
          anyOf:
          - $ref: '#/components/schemas/VaultMemberUserInfo'
          - type: 'null'
        responded_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Responded At
        status:
          title: Status
          type: string
        vault_id:
          title: Vault Id
          type: string
        vault_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Vault Name
      required:
      - id
      - vault_id
      - status
      - created_at
      title: VaultInvitationOut
      type: object
    VaultInvitationsListOut:
      description: Lista de invitaciones del usuario.
      properties:
        items:
          items:
            $ref: '#/components/schemas/VaultInvitationOut'
          title: Items
          type: array
      required:
      - items
      title: VaultInvitationsListOut
      type: object
    VaultMemberGrantIn:
      additionalProperties: false
      description: 'Permiso de acceso: carpeta y nivel.'
      properties:
        folder:
          maxLength: 600
          minLength: 1
          title: Folder
          type: string
        level:
          enum:
          - lectura
          - escritura
          title: Level
          type: string
      required:
      - folder
      - level
      title: VaultMemberGrantIn
      type: object
    VaultMemberGrantOut:
      description: Permiso de acceso (salida).
      properties:
        folder:
          title: Folder
          type: string
        level:
          title: Level
          type: string
      required:
      - folder
      - level
      title: VaultMemberGrantOut
      type: object
    VaultMemberGrantsUpdate:
      additionalProperties: false
      description: 'Cuerpo de `PUT /vaults/{vault_id}/members/{member_id}/grants`:
        reemplazar permisos.'
      properties:
        grants:
          items:
            $ref: '#/components/schemas/VaultMemberGrantIn'
          maxItems: 100
          minItems: 1
          title: Grants
          type: array
      required:
      - grants
      title: VaultMemberGrantsUpdate
      type: object
    VaultMemberInviteIn:
      additionalProperties: false
      description: 'Cuerpo de `POST /vaults/{vault_id}/members`: invitar un usuario.'
      properties:
        email:
          title: Email
          type: string
        grants:
          items:
            $ref: '#/components/schemas/VaultMemberGrantIn'
          maxItems: 100
          minItems: 1
          title: Grants
          type: array
      required:
      - email
      - grants
      title: VaultMemberInviteIn
      type: object
    VaultMemberOut:
      description: Miembro de una bóveda con sus permisos.
      properties:
        created_at:
          title: Created At
          type: string
        ended_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Ended At
        ended_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Ended Reason
        grants:
          default: []
          items:
            $ref: '#/components/schemas/VaultMemberGrantOut'
          title: Grants
          type: array
        id:
          title: Id
          type: string
        invited_by:
          title: Invited By
          type: string
        responded_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Responded At
        status:
          title: Status
          type: string
        user:
          anyOf:
          - $ref: '#/components/schemas/VaultMemberUserInfo'
          - type: 'null'
        user_id:
          title: User Id
          type: string
        vault_id:
          title: Vault Id
          type: string
      required:
      - id
      - vault_id
      - user_id
      - status
      - invited_by
      - created_at
      title: VaultMemberOut
      type: object
    VaultMemberUserInfo:
      description: Información pública del usuario (invitante o invitado).
      properties:
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        email:
          title: Email
          type: string
        id:
          title: Id
          type: string
      required:
      - id
      - email
      title: VaultMemberUserInfo
      type: object
    VaultMembersListOut:
      description: Lista de miembros de una bóveda.
      properties:
        items:
          items:
            $ref: '#/components/schemas/VaultMemberOut'
          title: Items
          type: array
      required:
      - items
      title: VaultMembersListOut
      type: object
