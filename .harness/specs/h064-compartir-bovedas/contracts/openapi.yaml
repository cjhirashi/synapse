paths:
  /invitations:
    get:
      description: 'Mis invitaciones y accesos; sin `status`, los pendientes y los
        activos. Es de solo lectura y también la leen las claves

        de API de la cuenta (H-064 F4: así el plugin de un agente descubre las bóvedas
        compartidas); responder sigue siendo solo de la sesión.'
      operationId: list_invitations_invitations_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - enum:
            - pendiente
            - activo
            - revocado
            type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultInvitationsListOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: List Invitations
      tags:
      - sharing
