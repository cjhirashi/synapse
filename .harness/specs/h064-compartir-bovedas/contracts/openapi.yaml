components:
  schemas:
    Problem:
      additionalProperties: false
      description: 'RFC 9457 Problem Details: body of every API error response.'
      properties:
        detail:
          title: Detail
          type: string
        errors:
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          title: Instance
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - instance
      title: Problem
      type: object
    ProblemError:
      additionalProperties: false
      description: 'A single validation failure. Carries exactly one location: pointer,
        parameter or header.'
      properties:
        detail:
          title: Detail
          type: string
        header:
          title: Header
          type: string
        parameter:
          title: Parameter
          type: string
        pointer:
          title: Pointer
          type: string
      required:
      - detail
      title: ProblemError
      type: object
    VaultInvitationOut:
      description: Invitación o membresía del usuario (vista desde el invitado).
      properties:
        created_at:
          title: Created At
          type: string
        grants:
          default: []
          items:
            $ref: '#/components/schemas/VaultMemberGrantOut'
          title: Grants
          type: array
        id:
          title: Id
          type: string
        owner:
          anyOf:
          - $ref: '#/components/schemas/VaultMemberUserInfo'
          - type: 'null'
        responded_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Responded At
        status:
          title: Status
          type: string
        vault_id:
          title: Vault Id
          type: string
        vault_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Vault Name
      required:
      - id
      - vault_id
      - status
      - created_at
      title: VaultInvitationOut
      type: object
    VaultInvitationsListOut:
      description: Lista de invitaciones del usuario.
      properties:
        items:
          items:
            $ref: '#/components/schemas/VaultInvitationOut'
          title: Items
          type: array
      required:
      - items
      title: VaultInvitationsListOut
      type: object
    VaultMemberGrantIn:
      additionalProperties: false
      description: 'Permiso de acceso: carpeta y nivel.'
      properties:
        folder:
          maxLength: 600
          minLength: 1
          title: Folder
          type: string
        level:
          enum:
          - lectura
          - escritura
          title: Level
          type: string
      required:
      - folder
      - level
      title: VaultMemberGrantIn
      type: object
    VaultMemberGrantOut:
      description: Permiso de acceso (salida).
      properties:
        folder:
          title: Folder
          type: string
        level:
          title: Level
          type: string
      required:
      - folder
      - level
      title: VaultMemberGrantOut
      type: object
    VaultMemberGrantsUpdate:
      additionalProperties: false
      description: 'Cuerpo de `PUT /vaults/{vault_id}/members/{member_id}/grants`:
        reemplazar permisos.'
      properties:
        grants:
          items:
            $ref: '#/components/schemas/VaultMemberGrantIn'
          maxItems: 100
          minItems: 1
          title: Grants
          type: array
      required:
      - grants
      title: VaultMemberGrantsUpdate
      type: object
    VaultMemberInviteIn:
      additionalProperties: false
      description: 'Cuerpo de `POST /vaults/{vault_id}/members`: invitar un usuario.'
      properties:
        email:
          title: Email
          type: string
        grants:
          items:
            $ref: '#/components/schemas/VaultMemberGrantIn'
          maxItems: 100
          minItems: 1
          title: Grants
          type: array
      required:
      - email
      - grants
      title: VaultMemberInviteIn
      type: object
    VaultMemberOut:
      description: Miembro de una bóveda con sus permisos.
      properties:
        created_at:
          title: Created At
          type: string
        ended_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Ended At
        ended_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Ended Reason
        grants:
          default: []
          items:
            $ref: '#/components/schemas/VaultMemberGrantOut'
          title: Grants
          type: array
        id:
          title: Id
          type: string
        invited_by:
          title: Invited By
          type: string
        responded_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Responded At
        status:
          title: Status
          type: string
        user:
          anyOf:
          - $ref: '#/components/schemas/VaultMemberUserInfo'
          - type: 'null'
        user_id:
          title: User Id
          type: string
        vault_id:
          title: Vault Id
          type: string
      required:
      - id
      - vault_id
      - user_id
      - status
      - invited_by
      - created_at
      title: VaultMemberOut
      type: object
    VaultMemberUserInfo:
      description: Información pública del usuario (invitante o invitado).
      properties:
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        email:
          title: Email
          type: string
        id:
          title: Id
          type: string
      required:
      - id
      - email
      title: VaultMemberUserInfo
      type: object
    VaultMembersListOut:
      description: Lista de miembros de una bóveda.
      properties:
        items:
          items:
            $ref: '#/components/schemas/VaultMemberOut'
          title: Items
          type: array
      required:
      - items
      title: VaultMembersListOut
      type: object
info:
  title: Synapse
  version: 0.1.0
openapi: 3.1.0
paths:
  /invitations:
    get:
      description: Mis invitaciones y accesos; sin `status`, los pendientes y los
        activos.
      operationId: list_invitations_invitations_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - enum:
            - pendiente
            - activo
            - revocado
            type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultInvitationsListOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: List Invitations
      tags:
      - sharing
  /invitations/{member_id}/accept:
    post:
      operationId: accept_invitation_invitations__member_id__accept_post
      parameters:
      - in: path
        name: member_id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: Member Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultMemberOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Member not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invitation not pending
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Accept Invitation
      tags:
      - sharing
  /invitations/{member_id}/leave:
    post:
      operationId: leave_vault_invitations__member_id__leave_post
      parameters:
      - in: path
        name: member_id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: Member Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Member not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invitation not pending
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Leave Vault
      tags:
      - sharing
  /invitations/{member_id}/reject:
    post:
      operationId: reject_invitation_invitations__member_id__reject_post
      parameters:
      - in: path
        name: member_id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: Member Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultMemberOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Member not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invitation not pending
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Reject Invitation
      tags:
      - sharing
  /vaults/{vault_id}/members:
    get:
      operationId: list_members_vaults__vault_id__members_get
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultMembersListOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: List Members
      tags:
      - sharing
    post:
      operationId: invite_member_vaults__vault_id__members_post
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultMemberInviteIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultMemberOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Invitee not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Member already exists / Member limit reached
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Invite Member
      tags:
      - sharing
  /vaults/{vault_id}/members/{member_id}:
    delete:
      description: Cancela una invitación pendiente o revoca un acceso activo. Las
        concesiones se conservan como historial.
      operationId: end_member_vaults__vault_id__members__member_id__delete
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: member_id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: Member Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Member not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invitation not pending
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: End Member
      tags:
      - sharing
  /vaults/{vault_id}/members/{member_id}/grants:
    put:
      operationId: update_member_grants_vaults__vault_id__members__member_id__grants_put
      parameters:
      - in: path
        name: vault_id
        required: true
        schema:
          format: uuid
          title: Vault Id
          type: string
      - in: path
        name: member_id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: Member Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultMemberGrantsUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultMemberOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not authenticated / Invalid token
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Password change required
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Vault not found / Member not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invitation not pending
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation error
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      summary: Update Member Grants
      tags:
      - sharing
