# Réplica en producción del proxy de desarrollo (vite.config.ts): la SPA y la API comparten
# origen, así las cookies de sesión (SPEC-0002) viajan sin CORS. Si cambia una ruta en
# vite.config.ts, cambia aquí también.

# `/vaults` es a la vez ruta de la API y de la SPA (SPEC-0003): una navegación del
# navegador (pide HTML) recibe la app; las llamadas `fetch` van al backend.
map $http_accept $wants_html {
    default      0;
    "~text/html" 1;
}

upstream synapse_backend {
    server backend:8000;
}

server {
    listen 3000;
    root /usr/share/nginx/html;

    # Cabeceras comunes del reenvío; If-Match y ETag pasan sin tocar (contrato de 0003).
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/ {
        proxy_pass http://synapse_backend;
    }

    location /admin/ {
        proxy_pass http://synapse_backend;
    }

    location /vaults {
        # `rewrite … last` es de los usos seguros de `if` en nginx.
        if ($wants_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://synapse_backend;
    }

    # Resto de rutas de la SPA (React Router): el archivo si existe, si no la app.
    location / {
        try_files $uri /index.html;
    }
}
