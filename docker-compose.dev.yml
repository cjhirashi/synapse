name: synapse

services:
  backend:
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    # La etapa `build` del Dockerfile tiene Node; la final (nginx) no puede correr Vite.
    build:
      context: ./frontend
      target: build
    volumes:
      - ./frontend/src:/app/src
    environment:
      - BACKEND_URL=http://backend:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
