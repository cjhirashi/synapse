name: synapse

services:
  # Dev: backend con recarga en caliente. El volumen sombrea `/app`, así que `/app/static`
  # (el build del frontend de la imagen) no está presente y la app arranca como API pura
  # (SPEC-0007, RF-006). La SPA en desarrollo la sirve Vite en el host (`npm run dev`, proxy
  # de vite.config.ts al backend); ver frontend/README.md.
  backend:
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
