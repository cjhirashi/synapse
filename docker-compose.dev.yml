name: synapse

services:
  backend:
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_DEV=true
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
