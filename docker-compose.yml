name: synapse

services:
  # El backend sirve la API y la SPA (SPEC-0007): ya no hay contenedor `frontend`/nginx.
  # El contexto de build es la raíz del repo para compilar también `frontend/` en la imagen.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: synapse-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - couchdb
    networks:
      - synapse_internal
      - net-synapse

  couchdb:
    image: couchdb:3
    container_name: synapse-couchdb
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - /mnt/disco1/synapse-data/couchdb:/opt/couchdb/data
    networks:
      - synapse_internal

  postgres:
    image: postgres:15
    container_name: synapse-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - /mnt/disco1/synapse-data/postgres:/var/lib/postgresql/data
    networks:
      - synapse_internal

  # Archivos subidos (imágenes/PDF/video/HTML, H-015+): instancia PROPIA de Synapse, no
  # compartida con otros proyectos (decisión de Carlos 2026-10-30, mismo patrón que
  # cjhirashi-career/minio_storage pero sin reusarlo). `net-synapse` para que Caddy
  # (`files-synapse.cjhirashi.com`) alcance el puerto 9000 directo, igual que
  # `files.cjhirashi.com` → `minio_storage:9000` en cjhirashi-career. Consola admin (9001)
  # se queda interna, sin exponer.
  minio:
    image: minio/minio:latest
    container_name: synapse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - /mnt/disco1/synapse-data/minio:/data:rw
    networks:
      - synapse_internal
      - net-synapse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  synapse_internal:
    name: synapse_internal
  net-synapse:
    external: true
